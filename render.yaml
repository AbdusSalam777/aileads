# Render blueprint for the backend API.
#
# This app has no SMTP sending of its own: leads are exported as JSON with a
# ready-to-send subject/body and sent from wherever the operator pastes them.
# Render only needs to serve the API, host unsubscribe links, and (optionally)
# poll IMAP for replies.
#
# The free plan sleeps after ~15 minutes without an inbound request, and a
# sleeping service runs no cron jobs — point a free external pinger
# (cron-job.org, UptimeRobot) at /api/v1/health every 10 minutes if discovery
# needs to keep running unattended.
services:
  - type: web
    name: ai-leads-api
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV is production here, which otherwise
    # makes npm skip devDependencies — including TypeScript, so the build fails
    # with "tsc: not found". Only dist/ is needed at runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Every secret below is set in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      # Must be the public Render URL, or unsubscribe links in sent mail break.
      - key: PUBLIC_BASE_URL
        sync: false
      # The deployed Netlify origin, for CORS.
      - key: CLIENT_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # IMAP is optional and reply-detection only — set these two if you want
      # replies to exported leads tracked in Analytics.
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
